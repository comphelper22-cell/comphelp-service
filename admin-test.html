<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Login Test | CompHelp Service</title>
  <style>
    :root{--bg:#070b10;--text:#f5f8fb;--muted:#a9b8c6;--line:rgba(255,255,255,.14);--accent:#25e1b1;--danger:#ff7a90;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#070b10,#0b121a);color:var(--text);padding:1rem}.card{width:min(560px,100%);border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.06);padding:1rem}h1{margin-top:0}.row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:.85rem 0}.yes{color:var(--accent);font-weight:900}.no{color:var(--danger);font-weight:900}.muted{color:var(--muted);line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <h1>Admin Login Test</h1>
    <p class="muted">This page checks whether Marketplace Manager role secrets are configured. It does not show secret values.</p>
    <div class="row"><strong>Admin configured</strong><span id="admin">Checking...</span></div>
    <div class="row"><strong>Manager configured</strong><span id="manager">Checking...</span></div>
    <div class="row"><strong>Viewer configured</strong><span id="viewer">Checking...</span></div>
    <p class="muted" id="status"></p>
  </main>
  <script>
    (async function () {
      function set(id, value) {
        var el = document.getElementById(id);
        el.textContent = value ? "yes" : "no";
        el.className = value ? "yes" : "no";
      }
      try {
        var response = await fetch("/api/admin-test", { cache: "no-store" });
        var data = await response.json();
        set("admin", data.adminConfigured);
        set("manager", data.managerConfigured);
        set("viewer", data.viewerConfigured);
        document.getElementById("status").textContent = "Status loaded.";
      } catch (error) {
        document.getElementById("status").textContent = "Could not load admin configuration status.";
      }
    })();
  </script>
</body>
</html>
