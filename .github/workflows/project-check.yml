name: Project Check

on:
  push:
  pull_request:

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Check Project
        run: npm run check-project

      - name: Lint
        run: npm run lint
